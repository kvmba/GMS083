name: beidou

services:
  beidou:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"
    image: beidou:latest
    container_name: GMS083
    network_mode: bridge
    init: true
    stop_grace_period: 30s
    working_dir: /workspace/gms-server
    volumes:
      # 运行期挂载整个仓库根目录，wz/scripts/handbook 全部来自宿主机
      # 编译产物 jar/application.yml 放在镜像内 /app，不会被挂载覆盖
      - .:/workspace
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      SERVER_PORT: "${SERVER_PORT:-8686}"
      APP_VUE_URL: "${APP_VUE_URL:-http://localhost:8787}"
      JWT_SECRET: "${JWT_SECRET:-please-change-me-in-production}"
      JWT_DURATION: "${JWT_DURATION:-1800000}"
      # 数据库连接(通过 .env 的 DB_URL/DB_USERNAME/DB_PASSWORD 覆盖)
      DB_URL: "${DB_URL:-jdbc:mysql://127.0.0.1:3306/GMS083?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&connectTimeout=5000}"
      DB_USERNAME: "${DB_USERNAME:-gms}"
      DB_PASSWORD: "${DB_PASSWORD:-gms}"
      GMS_LANGUAGE: "${GMS_LANGUAGE:-zh-CN}"
      GMS_WAN_HOST: "${GMS_WAN_HOST:-127.0.0.1}"
      GMS_LAN_HOST: "${GMS_LAN_HOST:-127.0.0.1}"
      GMS_LOCALHOST: "${GMS_LOCALHOST:-127.0.0.1}"
      GMS_LOGIN_PORT: "${GMS_LOGIN_PORT:-8484}"
      SWAGGER_ENABLED: "${SWAGGER_ENABLED:-false}"
      MULTIPART_MAX_FILE_SIZE: "${MULTIPART_MAX_FILE_SIZE:-1MB}"
      MULTIPART_MAX_REQUEST_SIZE: "${MULTIPART_MAX_REQUEST_SIZE:-10MB}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-false}"
      RATE_LIMIT_LIMIT: "${RATE_LIMIT_LIMIT:-10}"
      RATE_LIMIT_DURATION: "${RATE_LIMIT_DURATION:-1000}"
      RATE_LIMIT_AUTO_BAN: "${RATE_LIMIT_AUTO_BAN:-false}"
    ports:
      - "${SERVER_PORT:-8686}:${SERVER_PORT:-8686}"
      - "${GMS_LOGIN_PORT:-8484}:${GMS_LOGIN_PORT:-8484}"
      - "${CHANNEL_PORT_RANGE:-7575-7600}:${CHANNEL_PORT_RANGE:-7575-7600}"
    restart: unless-stopped
