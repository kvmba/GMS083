server:
  port: ${SERVER_PORT:8686}

app:
  vue: ${APP_VUE_URL:http://localhost:8787}

jwt:
  # secret 生产环境必须通过环境变量 JWT_SECRET 注入,避免使用仓库默认值
  secret: "${JWT_SECRET:please-change-me-in-production}"
  # token 过期时间（毫秒）默认 30min
  duration: ${JWT_DURATION:1800000}

mybatis-flex:
  datasource:
    mysql:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: "${DB_URL:jdbc:mysql://localhost:3306/beidou?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&connectTimeout=5000}"
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:root}
  global-config:
    print-banner: false

# swagger路径：http://localhost:8686/swagger-ui/index.html
springdoc:
  # 生产环境需要关闭这2个参数
  api-docs:
    # 是否开启OpenApi，如果为false，则SwaggerUI也会被禁用
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    # 是否开启SwaggerUI，依赖OpenApi的开启
    enabled: ${SWAGGER_ENABLED:false}

spring:
  flyway:
    # 禁用版本验证
    validate-on-migrate: false
    # 允许乱序执行：补跑版本号小于已执行最大版本号的漏掉脚本
    out-of-order: true
  servlet:
    # 默认文件大小就是这里设置的，按需修改
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:1MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:10MB}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

gms:
  service:
    # zh-CN en-US
    language: ${GMS_LANGUAGE:zh-CN}
    rate-limit:
      # 是否开启限流
      enabled: ${RATE_LIMIT_ENABLED:false}
      # 每ip多少时间内最大请求数
      limit: ${RATE_LIMIT_LIMIT:10}
      # 每ip最大请求数多少时间重置，单位ms
      duration: ${RATE_LIMIT_DURATION:1000}
      # 是否自动封禁
      auto-ban: ${RATE_LIMIT_AUTO_BAN:false}
    # 公网ip
    wan-host: ${GMS_WAN_HOST:127.0.0.1}
    # 局域网ip
    lan-host: ${GMS_LAN_HOST:127.0.0.1}
    # 本地ip
    localhost: ${GMS_LOCALHOST:127.0.0.1}
    # 客户端登录端口
    login-port: ${GMS_LOGIN_PORT:8484}
